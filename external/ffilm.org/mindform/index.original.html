    const peel=(oldState==='CUT'?(1-stateMix):0)+(state==='CUT'?stateMix:0);
    const peelAmount=peel*(col/cellsU)*.09;
    line.push(project([point[0]+(flight+peelAmount)*nx,point[1]+(flight+peelAmount)*ny,point[2]+(flight+peelAmount)*nz]));
   }grid.push(line)
  }
  const wave=.81+.19*Math.sin(sim*.85+tile.stagger);
  x.globalAlpha=tile.alpha*wave*(z<0?.58:1)*(state==='SQUARE'?1:state==='WEAVE'?.81:.72);
  for(let row=0;row<cellsV;row++)for(let col=0;col<cellsU;col++){
   const crop=[sx+Math.floor(sw*col/cellsU),sy+Math.floor(sh*row/cellsV),Math.ceil(sw/cellsU),Math.ceil(sh/cellsV)];
   const pp=[grid[row][col],grid[row][col+1],grid[row+1][col],grid[row+1][col+1]];
   mappedTriangle(im,crop,pp,false);mappedTriangle(im,crop,pp,true);
  }
  x.globalAlpha=1;
 }
}

function addEvent(i,j){let entry={time:sim.toFixed(1),text:bodies[i].name+' / '+bodies[j].name};log.unshift(entry);log=log.slice(0,6);events.replaceChildren(...log.map(e=>{let d=document.createElement('div');d.className='event';d.textContent='T+'+e.time+'  '+e.text+' · DEAL LANDED';return d}))}
function paintLegend(){legend.replaceChildren(...bodies.map((b,i)=>{let btn=document.createElement('button');btn.className=selected!==-1&&selected!==i?'off':'';btn.textContent=b.name+'  '+b.p+':'+(irrational&&b.name==='ASK CLERK'?'√2':b.q)+'  ● UNASSIGNED';btn.style.borderLeft='3px solid '+b.c;btn.onclick=()=>{selected=selected===i?-1:i;paintLegend()};return btn}))}
paintLegend();
const hud=document.querySelector('#hud'),indexToggle=document.querySelector('#indexToggle');
indexToggle.onclick=()=>{const open=hud.classList.toggle('show-index');indexToggle.setAttribute('aria-expanded',String(open));indexToggle.textContent=open?'CLOSE':'INDEX'};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'RESUME':'PAUSE';e.currentTarget.setAttribute('aria-pressed',String(paused))};
document.querySelector('#mode').onclick=e=>{irrational=!irrational;log=[];active.clear();events.textContent='Awaiting overlap.';e.currentTarget.textContent='IRRATIONAL FINGER / '+(irrational?'ON':'OFF');e.currentTarget.setAttribute('aria-pressed',String(irrational));paintLegend()};
document.querySelector('#reset').onclick=()=>{sim=0;cycleIndex=0;nextTransition=10;forced=null;log=[];active.clear();events.textContent='Awaiting overlap.';refreshState()};
function draw(now){
 if(!lastFrame)lastFrame=now;if(now-lastFrame<32){requestAnimationFrame(draw);return}const elapsed=Math.min((now-lastFrame)/1000,.08);lastFrame=now;
 if(!paused){sim+=elapsed*Number(document.querySelector('#speed').value);advanceState()}
 const state=currentState();if(state!==lastState){if(state==='DEAL'&&sim-lastDeal>1){lastDeal=sim;fireBurst(rand(0,TAU),rand(0,TAU))}lastState=state;refreshState()}
 if(!paused)t+=elapsed*.36;
 pulse*=.94;
 // One angular-velocity vector with continuous damping. Fingers transfer speed into mass;
 // idle restores the ring's home tilt only after momentum has had time to dissipate.
 const idle=Math.max(0,(performance.now()-lastInteraction)/1000-7);
 const home=Math.min(1,idle/12), drag=Math.exp(-(home?.68:.22)*elapsed);
 if(!pointers.size){
   vx*=drag;vy*=drag;vr*=drag;
   const momentum=Math.hypot(vx,vy,vr);
   const precession=Math.min(.12,momentum*.027);
   ry+=(vx+Math.sin(sim*.48)*precession)*elapsed;
   rx+=(vy+Math.cos(sim*.54)*precession)*elapsed;
   roll+=vr*elapsed;
   if(home){rx+=(HOME_RX-rx)*elapsed*.28*home;roll+=(HOME_ROLL-roll)*elapsed*.20*home;
    const idleSpeed=.06;vx+=(idleSpeed-vx)*elapsed*.08*home;}
 } else {vx*=.985;vy*=.985;vr*=.985}
 // A heavy state transition: ease into CUT, then damped overshoot toward SQUARE's level.
 if(stateMix<1){stateMix=Math.min(1,stateMix+elapsed/(nextState==='CUT'?.95:nextState==='SQUARE'?1.35:.7));}
 if(nextState==='SQUARE'&&stateMix>.7&&!pointers.size){const settle=(stateMix-.7)/.3;rx+=(HOME_RX-rx)*elapsed*.35*settle;roll+=(HOME_ROLL-roll)*elapsed*.35*settle}

 x.clearRect(0,0,W,H);
 let background=[];
 for(const p of pts){let u=p.u+t*.12,v=p.v+t*.08;if(currentState()==='CUT'&&Math.abs(Math.cos(u))<.13)continue;let XYZ=deckPoint(u,v,p.band),q=project(XYZ);background.push([q,p])}
 background.sort((a,b)=>a[0][2]-b[0][2]);x.globalCompositeOperation='lighter';
 for(const [q,p] of background){let [sx,sy,z,depth]=q;if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;x.fillStyle=`hsla(${164+p.band*9},75%,55%,${opacity*.18*depth})`;x.beginPath();x.arc(sx,sy,1.2*depth,0,TAU);x.fill()}
 x.globalCompositeOperation='source-over';paintConfetti();
 const positions=bodies.map(b=>phase(b));let highlighted=new Set(),nextActive=new Set();
 for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){
  let [u,v]=positions[i],[U,V]=positions[j],near=angleDiff(u,U)<.18&&angleDiff(v,V)<.23,key=i+':'+j;
  if(near){nextActive.add(key);highlighted.add(i);highlighted.add(j);if(!active.has(key)){addEvent(i,j);if(currentState()==='SQUARE'&&sim-lastDeal>3){lastDeal=sim;fireBurst(u,v);forced='DEAL';forcedUntil=sim+2;refreshState()}}}
 }
 active=nextActive;
 bodies.forEach((b,i)=>{
  if(selected!==-1&&i!==selected)return;
  const phase0=b.phase,k=(irrational||currentState()==='WEAVE')&&b.name==='ASK CLERK'?Math.SQRT2:b.q;
  const turns=(irrational||currentState()==='WEAVE')&&b.name==='ASK CLERK'?5:1,steps=turns*130;
  x.beginPath();let pen=false;for(let n=0;n<=steps;n++){let unit=n/130*TWO,u=phase0+b.p*unit;if(currentState()==='CUT'&&Math.abs(Math.cos(u))<.13){pen=false;continue}let pt=project(deckPoint(u,phase0*.59+k*unit,i));pen?x.lineTo(pt[0],pt[1]):x.moveTo(pt[0],pt[1]);pen=true}
  x.strokeStyle=b.c+'54';x.lineWidth=1;x.stroke();
 });
 const projected=bodies.map((b,i)=>({b,i,p:project(deckPoint(...positions[i],i))})).sort((a,b)=>a.p[2]-b.p[2]);
 projected.forEach(({b,i,p})=>{if(selected!==-1&&i!==selected)return;const [sx,sy,z,d]=p,lit=highlighted.has(i),r=(lit?12:6)*d;
  x.shadowBlur=lit?35:16;x.shadowColor=b.c;x.fillStyle=b.c;x.beginPath();x.arc(sx,sy,r,0,TAU);x.fill();x.shadowBlur=0;
  x.strokeStyle=b.c;x.lineWidth=lit?2:1;x.beginPath();x.arc(sx,sy,r+5+(lit?Math.sin(sim*9)*3:0),0,TAU);x.stroke();
  if(hud.classList.contains('show-index')){x.font='10px ui-monospace, monospace';x.fillStyle=b.c;x.fillText(b.name,sx+r+8,sy+3)}
 });x.globalCompositeOperation='source-over';
 if(!paused){for(const sp of burst){sp.x+=sp.vx*elapsed;sp.y+=sp.vy*elapsed;sp.vx*=.975;sp.vy*=.975;sp.life-=elapsed}burst=burst.filter(sp=>sp.life>0)}
 for(const sp of burst){x.globalAlpha=Math.min(.85,sp.life);x.strokeStyle=sp.c;x.beginPath();x.moveTo(sp.x,sp.y);x.lineTo(sp.x-sp.vx*.035,sp.y-sp.vy*.035);x.stroke()}x.globalAlpha=1;
 out.innerHTML=`SHUFFLE θ / FINGER φ<br>STATE ${currentState()} · SIM T+${sim.toFixed(1)} · ${paused?'PAUSED':'RUNNING'}<br>CONJUNCTIONS ${log.length}<br>ZOOM ${zoom.toFixed(2)} · α ${opacity.toFixed(2)}<br>CONFETTI ${loaded()}/${images.length} · TOROID<br>ENTROPY ${quantumStatus} · POOL ${quantumDepth()} / 1024<br>LAMPS UNASSIGNED / NO FEED`;
 requestAnimationFrame(draw);
}
function centroid(arr){return arr.reduce((a,p)=>[a[0]+p.x/arr.length,a[1]+p.y/arr.length],[0,0])}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
let gesture=null,holdTimer=null,downAt=null,travel=0;
c.addEventListener('pointerdown',e=>{
 lastInteraction=performance.now();lastDragTime=lastInteraction;
 c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,ox:e.clientX,oy:e.clientY});
 const now=performance.now(); if(now-lastTap<300){pulse=1.5} lastTap=now;
 gesture=null;downAt={x:e.clientX,y:e.clientY,time:performance.now()};travel=0;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{if(pointers.size===1&&travel<14){paused=!paused;document.querySelector('#pause').textContent=paused?'RESUME':'PAUSE';downAt=null}},650);
});
c.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 let p=pointers.get(e.pointerId), dx=e.clientX-p.x,dy=e.clientY-p.y;const dragNow=performance.now(),dragDt=Math.max(.012,Math.min(.1,(dragNow-lastDragTime)/1000));lastDragTime=dragNow;lastInteraction=dragNow;travel+=Math.hypot(dx,dy);if(travel>14)clearTimeout(holdTimer);p.x=e.clientX;p.y=e.clientY;
 let a=[...pointers.values()];
 if(a.length===1){const drx=dy*.004,dry=dx*.004;vy=vy*.35+(drx/dragDt)*.65;vx=vx*.35+(dry/dragDt)*.65;ry+=dry;rx+=drx}
 else if(a.length===2){
   if(!gesture)gesture={d:dist(a[0],a[1]),ang:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x),z:zoom,r:roll};
   let nd=dist(a[0],a[1]), na=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);
   zoom=Math.max(.35,Math.min(4,gesture.z*nd/Math.max(20,gesture.d)));const newRoll=gesture.r+(na-gesture.ang);vr=vr*.45+((newRoll-roll)/dragDt)*.55;roll=newRoll;
 } else {
   let cc=centroid(a), old=centroid(a.map(v=>({x:v.ox,y:v.oy})));
   px+=(cc[0]-old[0])*.12;py+=(cc[1]-old[1])*.12;
   opacity=Math.max(.12,Math.min(1,opacity-dy*.0025));
 }
});
function up(e){lastInteraction=performance.now();clearTimeout(holdTimer);if(downAt&&pointers.size===1){const span=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y),duration=performance.now()-downAt.time;if(span>85&&duration<750)setState('RIFFLE',5);else if(span<15&&duration<500){const dist=Math.hypot(e.clientX-(W/2+px),e.clientY-(H/2+py)),rad=Math.min(W,H)*.44*zoom;if(dist>rad*.45&&dist<rad*1.23)setState('DEAL',2)}}downAt=null;pointers.delete(e.pointerId);gesture=null;for(const p of pointers.values()){p.ox=p.x;p.oy=p.y}}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
c.addEventListener('wheel',e=>{lastInteraction=performance.now();e.preventDefault();zoom=Math.max(.35,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));},{passive:false});
requestAnimationFrame(draw);
})();
</script>
