<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mindform · Jack</title>
<meta name="description" content="Mindform: a live display of Jack's mind. The clerk of the Time Travellers Guild, remembering as he works.">
<style>
:root{--ground:#030207;--ink:#dfeee8;--dim:#7d9a94;--line:#29554d;--lamp:#d7b25d;--red:#e0604f;--blue:#6fb6d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;background:#060b14cc;border:1px solid var(--line);padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.title{left:16px;top:max(14px,env(safe-area-inset-top));background:none;border:0;padding:0;letter-spacing:.16em;font-size:11px;opacity:.85}
.title b{display:block;font-size:15px;letter-spacing:.2em}
.lamp{display:inline-block;width:9px;height:9px;border-radius:50%;background:#333;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px #0008}
.lamp.on{background:var(--lamp);box-shadow:0 0 10px var(--lamp)}
.monitor{right:14px;top:max(14px,env(safe-area-inset-top));width:min(270px,44vw)}
.monitor h2,.register h2,.focus h2{margin:0 0 6px;font-size:10px;letter-spacing:.16em;color:#a8e1cb;font-weight:600}
.gauge{display:grid;grid-template-columns:88px 1fr 34px;align-items:center;gap:6px;margin:4px 0}
.gauge span{color:var(--dim);font-size:10px;letter-spacing:.08em}
.bar{height:6px;background:#0e1b22;border:1px solid #1d3a39;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f8f74,#a8e1cb);transition:width .9s ease}
.gauge em{font-style:normal;text-align:right;font-size:10px}
.mode{font-size:11px;letter-spacing:.12em;margin:2px 0 8px}
.register{right:14px;bottom:max(14px,env(safe-area-inset-bottom));width:min(270px,44vw);max-height:36vh;overflow:hidden}
.register .t{border-top:1px solid #183d3a;padding:4px 0;font-size:10px;color:#c9ddd7}
.register .t small{color:var(--dim)}
.focus{left:16px;bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,calc(100vw - 32px - min(270px,44vw) - 20px))}
.eras{display:flex;gap:3px;margin:6px 0 8px}
.eras div{flex:1;height:22px;border:1px solid #1d3a39;background:#0b1419;position:relative;font-size:8px;color:var(--dim);padding:2px 3px;overflow:hidden;white-space:nowrap;transition:background .8s,border-color .8s}
.eras div.on{background:#3a2e12;border-color:var(--lamp);color:#fff}
.memory{min-height:5.2em}
.memory .k{font-size:9px;letter-spacing:.16em;color:var(--red)}
.memory h3{margin:2px 0 4px;font:600 14px/1.3 Georgia,serif;letter-spacing:0;color:#fff}
.memory p{margin:0;font:13px/1.5 Georgia,serif;color:#d8e6e1;max-height:6.2em;overflow:hidden}
.credit{font-size:9px;color:var(--dim);margin-top:6px}
.credit a{color:inherit;pointer-events:auto}
.tape{position:fixed;left:0;right:0;top:50%;height:16px;transform:translateY(-50%) rotate(-3deg);opacity:.16;pointer-events:none}
.foot{position:absolute;left:16px;top:calc(max(14px,env(safe-area-inset-top)) + 46px);font-size:9px;color:var(--dim);max-width:260px;background:none;border:0;padding:0}
@media(max-width:700px){
 .monitor{width:calc(100vw - 28px);left:14px;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 64px);padding:8px 10px}
 .monitor .gauge{margin:2px 0}
 .foot{display:none}
 .memory p{max-height:4.6em}
 .register{display:none}
 .focus{width:calc(100vw - 32px)}
 .gauge{grid-template-columns:80px 1fr 30px}
}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas class="tape" id="tape" aria-hidden="true"></canvas>
<div class="hud">
  <div class="panel title"><b>MINDFORM</b>JACK · CLERK · CONCEIVED 1951</div>
  <div class="panel foot" id="feedState">Listening for the feed…</div>

  <section class="panel monitor" aria-label="Jack's internal state">
    <h2>INTERNAL STATE</h2>
    <div class="mode"><span class="lamp" id="awakeLamp"></span><span id="mode">DORMANT</span> · <span id="idle">–</span></div>
    <div id="gauges"></div>
  </section>

  <section class="panel focus" aria-label="What Jack is remembering">
    <h2>MEMORY IN VIEW</h2>
    <div class="eras" id="eras"></div>
    <div class="memory" id="memory"><p>Waiting for Jack to remember something.</p></div>
    <div class="credit" id="credit"></div>
  </section>

  <section class="panel register" aria-label="Recent thoughts">
    <h2>THOUGHT REGISTER</h2>
    <div id="thoughts">No thoughts yet.</div>
  </section>
</div>
<script>
(() => {
'use strict';
const FEED = new URLSearchParams(location.search).get('feed') || 'https://timetravellersguild.com/jack/mind.php';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GAUGES = [['activity','ACTIVITY'],['curiosity','CURIOSITY'],['reminiscence','REMINISCENCE'],['strain','STRAIN'],['company','COMPANY']];
const TOOL_WORDS = {web_search:'searched the web', read_site_page:'read his own site', list_site:'surveyed the site', search_lore:'opened the lore drawer', read_lore:'read a lore record',
  remember_my_life:'remembered', add_story_beat:'moved a story', whoami:'recognised someone', remember:'kept a note', search_map:'consulted his map', desk_items:'checked the desk', search_graph:'searched the tree'};

let life = null, state = {}, shown = {}, thoughts = [], lastThoughtAt = 0, focusMem = null;
$('gauges').innerHTML = GAUGES.map(([k, l]) => `<div class="gauge"><span>${l}</span><div class="bar"><i id="g-${k}" style="width:0%"></i></div><em id="v-${k}">0</em></div>`).join('');

/* ---------- the field: drifting evidence cards and memory particles ---------- */
const c = $('c'), x = c.getContext('2d');
let W = 0, H = 0, D = 1;
function resize() { D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * D; c.height = H * D; x.setTransform(D, 0, 0, D, 0, 0); }
addEventListener('resize', resize); resize();
const cards = [];           // {img, ev, a, r, z, sp, spin, glow}
const motes = Array.from({length: 260}, () => ({a: Math.random() * 6.283, r: 40 + Math.random() * 520, z: Math.random(), s: .0006 + Math.random() * .002, h: Math.random()}));
function addCard(ev) {
  if (cards.some((k) => k.ev.id === ev.id)) return;
  const img = new Image(); img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.src = ev.image.replace(/\/960px-/, '/330px-');
  cards.push({img, ev, a: Math.random() * 6.283, r: 140 + Math.random() * 360, z: .25 + Math.random() * .75, sp: (Math.random() < .5 ? -1 : 1) * (.00015 + Math.random() * .0004), spin: (Math.random() - .5) * .3, glow: 0});
}
function bring(evIds) {
  cards.forEach((k) => { if (evIds.includes(k.ev.id)) { k.glow = 1; k.target = true; } else k.target = false; });
}
let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000, cx = W / 2, cy = H * .44;
  x.clearRect(0, 0, W, H);
  const act = (shown.activity || 0), rem = (shown.reminiscence || 0), strain = (shown.strain || 0);
  // motes: the holes of his cards, faster when he is busy
  for (const m of motes) {
    m.a += m.s * (1 + act * 3) * (calm ? .2 : 1);
    const px = cx + Math.cos(m.a) * m.r * (W / 1400 + .3), py = cy + Math.sin(m.a) * m.r * .42 * (H / 900 + .3);
    x.fillStyle = m.h < rem ? `rgba(215,178,93,${.25 + m.z * .5})` : `rgba(168,225,203,${.12 + m.z * .35})`;
    x.fillRect(px, py + Math.sin(t * 2 + m.a * 5) * strain * 6, 1.6 + m.z * 1.8, 1.2);
  }
  // evidence cards orbit; recalled ones come forward
  const sorted = cards.slice().sort((a, b) => (a.target ? 2 : a.z) - (b.target ? 2 : b.z));
  for (const k of sorted) {
    k.a += k.sp * (calm ? .2 : 1);
    const tz = k.target ? 1.35 : k.z;
    k.zz = (k.zz == null ? tz : k.zz + (tz - k.zz) * .04);
    const tr = k.target ? 60 + (cards.indexOf(k) % 3) * 120 : k.r;
    k.rr = (k.rr == null ? tr : k.rr + (tr - k.rr) * .04);
    const px = cx + Math.cos(k.a) * k.rr * (W / 1300 + .25), py = cy + Math.sin(k.a) * k.rr * .38;
    const w = 92 * k.zz * (Math.min(W, 1200) / 900 + .4), h = w * .75;
    k.glow *= .995;
    x.save(); x.translate(px, py); x.rotate(k.spin * .2 + Math.sin(t * .3 + k.a) * .03);
    x.globalAlpha = k.target ? .96 : .22 + k.z * .35;
    x.fillStyle = '#e9e0c6'; x.fillRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 14);
    if (k.img.complete && k.img.naturalWidth) {
      x.filter = k.target ? 'none' : 'grayscale(.7) sepia(.3)';
      const s = Math.max(w / k.img.naturalWidth, h / k.img.naturalHeight), iw = k.img.naturalWidth * s, ih = k.img.naturalHeight * s;
      x.save(); x.beginPath(); x.rect(-w / 2, -h / 2, w, h); x.clip(); x.drawImage(k.img, -iw / 2, -ih / 2, iw, ih); x.restore(); x.filter = 'none';
    }
    if (k.glow > .05) { x.strokeStyle = `rgba(215,178,93,${k.glow})`; x.lineWidth = 2; x.strokeRect(-w / 2 - 6, -h / 2 - 6, w + 12, h + 18); }
    x.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- ticker tape: his state punched as holes ---------- */
const tp = $('tape'), tx = tp.getContext('2d');
function tape() {
  tp.width = innerWidth; tp.height = 16; tx.clearRect(0, 0, tp.width, 16);
  const off = (performance.now() / 40) % 12;
  for (let i = -1; i < tp.width / 12 + 1; i++) {
    const n = Math.floor(i + performance.now() / 480);
    for (let row = 0; row < 5; row++) {
      const v = ((n * 2654435761) >>> (row * 3)) & 7;
      if (v < 2 + Math.round((shown.activity || 0) * 4)) { tx.fillStyle = '#a8e1cb'; tx.beginPath(); tx.arc(i * 12 - off + 6, 2 + row * 3, 1.1, 0, 6.3); tx.fill(); }
    }
  }
  setTimeout(tape, calm ? 2000 : 120);
}
tape();

/* ---------- monitor: constantly changing, around the real readings ---------- */
function drift() {
  const now = performance.now() / 1000;
  GAUGES.forEach(([k], i) => {
    const base = state[k] || 0;
    const wobble = (Math.sin(now * (.31 + i * .17)) + Math.sin(now * (.83 + i * .07))) * .035 * (state.awake ? 1 : .4);
    shown[k] = Math.max(0, Math.min(1, base + wobble + (state.awake ? 0 : .02)));
    $('g-' + k).style.width = (shown[k] * 100).toFixed(1) + '%';
    $('v-' + k).textContent = Math.round(shown[k] * 100);
  });
  const idle = state.idle_seconds == null ? null : state.idle_seconds + Math.round((Date.now() - (state._seenAt || Date.now())) / 1000);
  $('idle').textContent = idle == null ? '–' : idle < 60 ? 'thinking now' : idle < 3600 ? `last thought ${Math.round(idle / 60)} min ago` : idle < 86400 ? `last thought ${Math.round(idle / 3600)} h ago` : 'resting';
  setTimeout(drift, 400);
}
drift();

function renderEras() {
  if (!life) return;
  $('eras').innerHTML = life.eras.map((e) => `<div class="${focusMem && (focusMem.era_id || focusMem.era) === e.id ? 'on' : ''}" title="${esc(e.years + ' · ' + e.title)}">${esc(e.years.replace('17.04.', ''))}</div>`).join('');
}
function showMemory(m, tag) {
  focusMem = m;
  const ev = (m.evidence || []).map((e) => typeof e === 'string' ? life.evidence.find((v) => v.id === e) : e).filter(Boolean);
  ev.forEach(addCard); bring(ev.map((e) => e.id));
  $('memory').innerHTML = `<span class="k">${esc(tag)} · JACK REMEMBERS · ${esc(m.year)}</span><h3>${esc(m.title)}</h3><p>${esc(m.text)}</p>`;
  $('credit').innerHTML = ev.length ? ev.map((e) => `REAL: ${esc(e.caption.split(':')[0])} (${esc(e.credit)}, ${esc(e.licence)}, <a href="${esc(e.source)}" target="_blank" rel="noopener">source</a>)`).join(' · ') : 'Evidence withheld: it has not happened in your present.';
  renderEras();
}
function renderThoughts() {
  $('thoughts').innerHTML = thoughts.slice(0, 8).map((t) => {
    const did = [...new Set(t.tools.map((n) => TOOL_WORDS[n]).filter(Boolean))].slice(0, 3).join(', ') || 'answered from the desk';
    const ago = Math.max(0, Math.round((Date.now() / 1000 - t.at) / 60));
    return `<div class="t"><small>${ago ? ago + ' min ago' : 'just now'} · ${esc(t.mode)} · ${esc(t.traveller)}${t.timeout ? ' · ran out of time' : ''}</small><br>${esc(did)}${t.recalled.length ? ' · recalled “' + esc(t.recalled[0].title) + '”' : ''}${t.cited.length ? ' · cited ' + esc(t.cited.slice(0, 3).join(', ')) : ''}</div>`;
  }).join('') || 'No thoughts yet.';
}

/* ---------- the feed ---------- */
let idleTimer = 0, idleIndex = 0;
async function poll() {
  try {
    const r = await fetch(FEED, {cache: 'no-store'});
    const j = await r.json();
    if (!j.ok) throw new Error('feed');
    if (!life) { life = j.life; life.evidence.forEach(addCard); renderEras(); }
    state = Object.assign(j.state, {_seenAt: Date.now()});
    $('mode').textContent = (state.awake ? state.mode : 'dormant').toUpperCase().replace('_', ' ');
    $('awakeLamp').classList.toggle('on', !!state.awake);
    thoughts = j.thoughts || []; renderThoughts();
    const newest = thoughts[0];
    if (newest && newest.at > lastThoughtAt) {
      lastThoughtAt = newest.at;
      if (newest.recalled.length) { showMemory(newest.recalled[0], 'JUST RECALLED'); idleTimer = Date.now(); }
    }
    $('feedState').textContent = 'Live feed from the desk · his side only: no visitor words are shown.';
  } catch (e) {
    $('feedState').textContent = 'The feed is quiet. Showing his memories from the archive.';
  }
  setTimeout(poll, 5000);
}
// While he is quiet, his mind wanders through his own life.
function wander() {
  if (life && Date.now() - idleTimer > 25000) {
    const m = life.memories[idleIndex++ % life.memories.length];
    showMemory(m, 'DRIFTING');
  }
  setTimeout(wander, 14000);
}
poll(); setTimeout(wander, 4000);
})();
</script>
</body>
</html>
