<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Machine — Guild Workbench</title><style>
:root{--ink:#203d35;--paper:#f4f1e7;--line:#d4d8c9;--green:#d5e7ad}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--ink);padding:9px 15px}button:hover{background:var(--green)}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{padding:32px 23px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.seal{font:46px Georgia;border:1px solid var(--ink);border-radius:50%;width:72px;height:72px;text-align:center}.brand{font:24px Georgia;line-height:1.2}small,.eyebrow{font:11px/1.5 monospace;letter-spacing:1.5px;text-transform:uppercase}nav{display:grid;gap:6px}nav button{text-align:left;border:0}nav button.active{background:var(--green)}.asidefoot{margin-top:auto;font-size:12px}main{padding:32px 5vw 70px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.badge{font:11px monospace;border:1px solid var(--line);padding:5px 9px;border-radius:20px}.hero{display:grid;grid-template-columns:1fr 190px;gap:30px;align-items:center;margin:38px 0}h1{font:clamp(38px,5vw,68px)/1.05 Georgia;margin:12px 0 20px;font-weight:normal;letter-spacing:-2px}h2{font:29px Georgia;font-weight:normal}h3{margin:0 0 10px;font:22px Georgia}p{max-width:680px}.orb{width:170px;height:170px;border:1px solid #809579;border-radius:50%;position:relative;display:grid;place-items:center;font:48px Georgia;background:repeating-radial-gradient(circle,transparent 0 17px,#b8c5ad 18px,transparent 19px)}.orb:after{content:'XIII';background:var(--paper);padding:10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{border:1px solid var(--line);padding:22px;border-radius:7px;background:#faf8f0}.card strong{display:block;font:38px Georgia;margin:8px 0}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;margin-top:28px}.row{padding:18px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.muted{color:#65736a}.pill{font:11px monospace;background:#e7e9dc;padding:4px 7px;border-radius:3px;display:inline-block}.verified{background:#d8e9be}.proposed{background:#f0dfb7}a{color:inherit;text-underline-offset:4px}label{display:grid;gap:5px;margin:14px 0;font-size:13px}input,textarea,select{width:100%;padding:10px;border:1px solid #b9c3b3;background:#fffef8;border-radius:4px;color:var(--ink)}textarea{min-height:100px}dialog{border:1px solid var(--line);border-radius:9px;max-width:650px;width:94%;max-height:90vh;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#15332899}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--ink);color:var(--paper)}.entryphotos{display:flex;gap:10px;flex-wrap:wrap}.entryphotos img{width:130px;height:110px;object-fit:cover;border-radius:4px}.tiers{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.check{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.check input{width:18px}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:white;padding:12px 20px;border-radius:5px;display:none}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{padding:18px;border-right:0;border-bottom:1px solid var(--line)}.seal,.asidefoot{display:none}.brand{font-size:20px}nav{display:flex;overflow:auto;gap:3px}nav button{white-space:nowrap}main{padding:22px}.hero{grid-template-columns:1fr}.orb{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid,.tiers{grid-template-columns:1fr}.top{gap:10px;flex-wrap:wrap}} 
</style><div class="shell"><aside><div class="seal">⌁</div><div class="brand">Time Travellers<br>Guild</div><small>Time Machine / Working archive</small><nav id="nav"></nav><div class="asidefoot">DEPARTMENT OF EXCESS TIME<br><br>Pending, not canon.<br><br>Working data stays in this browser. Export a backup to carry it elsewhere.</div></aside><main><div class="top"><small>Godden Interactive / Production desk</small><span class="badge">PRIVATE DRAFT · UNPUBLISHED</span><button id="export">Export backup ↓</button><button id="import">Import backup</button><input type="file" id="backup" accept="application/json" hidden></div><div id="view"></div></main></div><dialog id="editor"></dialog><div class="toast" role="status" id="toast"></div><script>
const key='ttg-workbench-v1';const sections=['Overview','Build log','Materials & techniques','Milestones','Documentation checklist','Tier copy','Open questions','Context & links'];const statuses=['Verified construction','Unfinished work','Proposal','Reported — needs evidence'];const initial={entries:[],materials:[],milestones:[],questions:[{title:'What is the funding target and costed minimum build?',notes:'Unknown. Budget and campaign dates remain to be decided.'},{title:'What can each supporter tier promise?',notes:'Confirm prices, capacity, delivery, credits and participation arrangements before use.'},{title:'Which photographs establish each construction milestone?',notes:'Attach original photographs and notes; distinguish capture date from entry date.'}],tiers:['Goodwill','Producer','Executive Producer','Volunteer','Actor','Craftsperson','Witch'].map(name=>({name,price:'',capacity:'',delivery:'',copy:({Goodwill:'Help the Time Travellers Guild document the making of its Time Machine.',Producer:'Support the making and documentation of the Time Machine.', 'Executive Producer':'Help support the wider ambition of the Time Machine build.',Volunteer:'Offer time and practical help to the build.',Actor:'Express interest in performing within the Time Travellers Guild.',Craftsperson:'Bring a making skill to the Time Machine.',Witch:'Bring your particular practice to the Time Travellers Guild.'})[name],terms:'Draft invitation only. Benefits and commitments await agreement.'})),checks:[['Attach original build photographs',false],['Record capture dates and source notes',false],['Verify completed construction against evidence',false],['Record materials, quantities and costs',false],['Confirm permissions for people in photographs',false],['Draft and review reusable captions',false],['Cost the target and contingency',false],['Confirm tier prices, capacity and delivery',false],['Review Jack character attribution and IP wording',false],['Review all campaign copy before publication',false]]};let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)}let page='Overview',filter='All';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch{notify('Storage is full. Export a backup, then use smaller photographs.');return false}}function notify(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}function tag(s){return '<span class="pill '+(s===statuses[0]?'verified':s===statuses[2]?'proposed':'')+'">'+esc(s)+'</span>'}function header(title,sub,action=''){return '<div class="hero"><div><small>THE TIME MACHINE / '+esc(page)+'</small><h1>'+title+'</h1><p class="muted">'+sub+'</p>'+action+'</div><div class="orb"></div></div>'}function button(label,fn){return '<button onclick="'+fn+'">'+label+'</button>'}function render(){ $('#nav').innerHTML=sections.map(s=>'<button class="'+(s===page?'active':'')+'" onclick="go(\''+s+'\')">'+s+'</button>').join('');let h='';if(page==='Overview'){h=header('A machine in the making.','A working record for the Time Travellers Guild Kickstarter. Keep the evidence close, the chronology intact, and the possibilities open.',button('+ Log a build entry',"edit('entries')"));h+='<div class="cards">'+[[data.entries.length,'Build entries'],[data.entries.filter(e=>e.status===statuses[0]).length,'Verified records'],[data.entries.filter(e=>e.status===statuses[1]).length,'Unfinished records'],[data.questions.length,'Open questions']].map(([n,t])=>'<div class="card"><small>'+t+'</small><strong>'+String(n).padStart(2,'0')+'</strong></div>').join('')+'</div><div class="grid"><section class="panel"><small>01 / Latest evidence</small><h2>The build record</h2>'+(data.entries.length?sorted().slice(-3).reverse().map(e=>entry(e)).join(''):'<p>No construction has been verified in this hub yet.</p><p class="muted">Earlier conversations report a living-room build and Day 2 photographs on 24 October 2026. Original images and detailed notes have not been imported or assessed here.</p>')+'</section><section class="panel"><small>02 / Campaign state</small><h2>Preparation</h2><div class="row">Funding target <span class="pill">Unknown</span></div><div class="row">Launch date <span class="pill">Unconfirmed</span></div><div class="row">Supporter tiers <span class="pill">7 draft tiers</span></div><div class="row">Checklist '+data.checks.filter(x=>x[1]).length+' / '+data.checks.length+' complete</div><p class="muted">Counts describe records in this hub, not physical build completion.</p></section></div>'}
else if(page==='Build log'){h=header('Record what happened.','Date each observation. Attach photographs and source notes. A proposal becomes verified only when you explicitly assess its evidence.',button('+ New entry',"edit('entries')"));h+='<label>Show status<select onchange="filter=this.value;render()">'+['All',...statuses].map(s=>'<option '+(s===filter?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label>';h+=sorted().filter(e=>filter==='All'||e.status===filter).map(e=>'<section class="panel" style="margin:15px 0">'+entry(e)+button('Edit entry',"edit('entries',"+data.entries.indexOf(e)+")")+'</section>').join('')||'<div class="panel">No entries in this view. Add your first photograph or note.</div>'}
else if(page==='Tier copy'){h=header('Seven ways to take part.','Editable draft invitations. Prices, rewards, limits and delivery are unknown until agreed. These names do not establish ownership or financial returns.');h+='<div class="tiers">'+data.tiers.map((t,i)=>'<article class="panel"><small>0'+(i+1)+' / Draft tier</small><h2>'+t.name+'</h2><p>'+esc(t.copy)+'</p><p class="muted">Price: '+esc(t.price||'Unknown')+' · Capacity: '+esc(t.capacity||'Unconfirmed')+'<br>Delivery: '+esc(t.delivery||'Unconfirmed')+'</p><p>'+esc(t.terms)+'</p>'+button('Edit tier',"tier("+i+")")+button('Copy draft',"copyTier("+i+")")+'</article>').join('')+'</div>'}
else if(page==='Documentation checklist'){h=header('Make the record usable.','Track the documentation needed before the campaign is ready. Completion here is a manual editorial decision.');h+='<section class="panel">'+data.checks.map((c,i)=>'<label class="check"><input type="checkbox" '+(c[1]?'checked':'')+' onchange="data.checks['+i+'][1]=this.checked;save();render()">'+esc(c[0])+'</label>').join('')+'</section>'}
else if(page==='Context & links'){h=header('The field around the machine.','Project context and character attribution, kept beside the build record.');h+='<div class="grid"><section class="panel"><h2>Time Travellers Guild</h2><p>The Time Machine is being made in Toby Godden’s living room and documented toward a Kickstarter campaign. The Guild’s wider world provides the context for the build.</p><div class="row"><a href="https://ffilm.org" target="_blank" rel="noopener">Ffilm.org ↗</a><p class="muted">Toby’s wider film, sound and browser-based artistic practice.</p></div><div class="row"><a href="https://timetravellersguild.com/bws" target="_blank" rel="noopener">Guild / bws ↗</a></div><div class="row"><a href="https://timetravellersguild.com/box" target="_blank" rel="noopener">Guild / box ↗</a></div></section><section class="panel"><small>Character / IP</small><h2>Jack</h2><p>Jack is an independent IP character by Godden Interactive.</p><p class="muted">Keep character attribution distinct from physical build records and supporter tier promises. Permissions and final campaign wording remain to be reviewed.</p><hr><p>“The machine does not predict. It measures relation.”</p><small>Pending, not canon.</small></section></div>'}
else{let type=page==='Materials & techniques'?'materials':page==='Milestones'?'milestones':'questions';h=header(page==='Materials & techniques'?'What it is made of.':page==='Milestones'?'Mark the turning points.':'Leave room for the unknown.',type==='materials'?'Record quantities, costs, sources and methods. Preserve estimates as estimates.':type==='milestones'?'Separate reached milestones from intended ones, with dates and evidence.':'Keep unresolved decisions visible until there is an answer.',button('+ Add record',"edit('"+type+"')"));h+=data[type].map((e,i)=>'<article class="panel" style="margin:15px 0"><h3>'+esc(e.title)+'</h3>'+tag(e.status||'Open')+'<p style="white-space:pre-wrap">'+esc(e.notes)+'</p>'+button('Edit',"edit('"+type+"',"+i+")")+'</article>').join('')||'<section class="panel">No records yet. Unknowns are welcome here.</section>'}$('#view').innerHTML=h}function go(s){page=s;render()}function sorted(){return [...data.entries].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}function entry(e){return '<div class="row"><small>'+esc(e.date||'Date unknown')+'</small><h3>'+esc(e.title)+'</h3>'+tag(e.status)+'<p style="white-space:pre-wrap">'+esc(e.notes)+'</p><p class="muted">Evidence / source: '+esc(e.source||'Not supplied')+'</p><div class="entryphotos">'+(e.photos||[]).map(p=>'<a href="'+p.src+'" target="_blank"><img src="'+p.src+'" alt="'+esc(p.name)+'"></a>').join('')+'</div>'+(e.caption?'<p><small>Draft caption</small><br>'+esc(e.caption)+'</p>':'')+'</div>'}function field(name,label,value,type='text'){return '<label>'+label+(type==='textarea'?'<textarea name="'+name+'">'+esc(value)+'</textarea>':'<input type="'+type+'" name="'+name+'" value="'+esc(value)+'">')+'</label>'}function modal(h){$('#editor').innerHTML=h;$('#editor').showModal()}function closeModal(){$('#editor').close()}function edit(type,i){let e=data[type][i]||{};modal('<form id="form"><small>Working archive / '+type+'</small><h2>'+ (i===undefined?'New record':'Edit record')+'</h2>'+field('title','Title',e.title||'')+(type==='entries'?field('date','Event / photograph date (leave blank if unknown)',e.date||'','date'):'')+'<label>Status<select name="status">'+(type==='questions'?['Open','Under review','Answered']:statuses).map(s=>'<option '+(s===e.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label>'+field('notes',type==='materials'?'Material, quantity, cost, supplier, technique and uncertainty':'Notes / what the evidence shows',e.notes||'','textarea')+(type==='entries'?field('source','Source / evidence reference',e.source||'')+field('caption','Reusable Kickstarter caption — draft',e.caption||'','textarea')+'<button type="button" onclick="draftCaption()">Draft caption from this record</button><label>Add photographs (retained in this browser)<input name="photos" type="file" multiple accept="image/*"></label><p class="muted">Existing photographs: '+(e.photos||[]).length+'. Added photos append to these.</p>':'')+'<div class="actions"><button class="primary">Save record</button><button type="button" onclick="closeModal()">Cancel</button>'+(i!==undefined?'<button type="button" onclick="removeRecord(\''+type+'\','+i+')">Delete</button>':'')+'</div></form>');$('#form').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target),n={...e,title:f.get('title'),status:f.get('status'),notes:f.get('notes')};if(!n.title.trim()){notify('Add a title.');return}if(type==='entries'){n.date=f.get('date');n.source=f.get('source');n.caption=f.get('caption');n.photos=[...(e.photos||[])];for(let file of ev.target.photos.files){if(file.size>4*1024*1024){notify('Use photographs smaller than 4 MB.');return}n.photos.push({name:file.name,src:await new Promise((r,j)=>{let rd=new FileReader;rd.onload=()=>r(rd.result);rd.onerror=j;rd.readAsDataURL(file)})})}}let old=structuredClone(data);if(i===undefined)data[type].push(n);else data[type][i]=n;if(save()){closeModal();render();notify('Record saved')}else data=old}}
function draftCaption(){let f=$('#form'),prefix=f.status.value===statuses[0]?'Verified build record':f.status.value===statuses[1]?'Work in progress':f.status.value===statuses[2]?'Proposed work':'Reported work — evidence pending';f.caption.value=prefix+' · '+(f.date.value||'Date unconfirmed')+' — '+f.elements.namedItem('title').value+'. '+f.notes.value}function removeRecord(t,i){if(confirm('Delete this record from this browser?')){data[t].splice(i,1);save();closeModal();render()}}function tier(i){let t=data.tiers[i];modal('<form id="tierform"><small>Draft tier</small><h2>'+t.name+'</h2>'+field('copy','Invitation / reward copy',t.copy,'textarea')+field('price','Pledge price (unknown until set)',t.price)+field('capacity','Capacity / limits',t.capacity)+field('delivery','Delivery / participation timing',t.delivery)+field('terms','Terms / unresolved commitments',t.terms,'textarea')+'<button class="primary">Save tier</button> <button type="button" onclick="closeModal()">Cancel</button></form>');$('#tierform').onsubmit=ev=>{ev.preventDefault();Object.assign(t,Object.fromEntries(new FormData(ev.target)));save();closeModal();render()}}async function copyTier(i){let t=data.tiers[i];try{await navigator.clipboard.writeText(t.name+' — DRAFT\n'+t.copy+'\nPrice: '+(t.price||'Unknown')+'\nCapacity: '+(t.capacity||'Unconfirmed')+'\nDelivery: '+(t.delivery||'Unconfirmed')+'\n'+t.terms);notify('Draft copied')}catch{notify('Clipboard unavailable. Select the tier text to copy.')}}$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}));a.download='ttg-workbench-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onclick=()=>$('#backup').click();$('#backup').onchange=async ev=>{try{let v=JSON.parse(await ev.target.files[0].text());if(v.schema!==1||!Object.keys(initial).every(k=>Array.isArray(v.data[k])))throw Error();if(confirm('Replace this browser’s working data with this backup?')){let old=data;data=v.data;if(save()){render();notify('Backup imported')}else data=old}}catch{notify('Could not import: choose a valid workbench backup.')}ev.target.value=''};render();
</script></html>
