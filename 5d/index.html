<!doctype html>
<html lang="cy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<title>Penteract · Pum Dimensiwn</title>
<style>
:root{
  --bg:#07090a; --ink:#e6dfcc; --dim:#8a907f; --rule:#2a302c;
  --green:#6bf27a; --brass:#d9a441; --cyan:#86cbd6; --paper:#efe6cf; --red:#d4473b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 var(--serif);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#c.hot{cursor:pointer}
#head{position:fixed;left:20px;top:18px;pointer-events:none;max-width:calc(100vw - 120px)}
#head .eye{font:11px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
#head h1{font-weight:normal;font-size:clamp(24px,3.2vw,36px);line-height:1.05;margin:6px 0 4px;letter-spacing:-.5px}
#head p{margin:0;color:var(--dim);font-size:13px}
#lang{position:fixed;right:16px;top:18px;display:flex;gap:6px}
#lang button{font:11px var(--mono);letter-spacing:.1em;color:var(--dim);background:transparent;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;cursor:pointer}
#lang button[aria-pressed=true]{color:#041006;background:var(--green);border-color:var(--green)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;font:11px var(--mono);color:var(--dim);text-align:center;pointer-events:none;width:calc(100vw - 40px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="head">
  <div class="eye" id="eye"></div>
  <h1>Penteract</h1>
  <p id="sub"></p>
</div>
<div id="lang" role="group" aria-label="Iaith / Language">
  <button id="bcy" aria-pressed="true">CY</button>
  <button id="ben" aria-pressed="false">EN</button>
</div>
<div id="hint"></div>
<script>
'use strict';
/* penteract — saith drws / seven doors. The cube is the menu. */

const UI={
  cy:{eye:'PUM DIMENSIWN · GWAITH Y GUILD', sub:'Saith drws i mewn. Llusgwch i droi; tarwch giwb i fynd drwyddo.', hint:'llusgwch i droi · tarwch giwb i agor'},
  en:{eye:'FIVE DIMENSIONS · GUILD WORK', sub:'Seven doors in. Drag to turn; tap a cube to go through.', hint:'drag to turn · tap a cube to open'}
};
const DOORS=[
  {href:'/jack/',        en:'THE DESK',     cy:'Y DDESG',     col:'#6bf27a'},
  {href:'/5d/tv/',       en:'THE SHOW',     cy:'Y SIOW',      col:'#d9a441'},
  {href:'/radio/',       en:'RADIO',        cy:'RADIO',       col:'#86cbd6'},
  {href:'/now',          en:'NOW',          cy:'NAWR',        col:'#efe6cf'},
  {href:'/passport/map', en:'PASSPORT',     cy:'PASBORT',     col:'#d4473b'},
  {href:'/interface13/', en:'INTERFACE 13', cy:'RYNGWYEB 13', col:'#b48ce8'},
  {href:'/join/',        en:'JOIN',         cy:'YMUNWCH',     col:'#e8b45a'}
];

let lang='cy'; try{ lang=localStorage.getItem('ttg-penteract-lang')||'cy' }catch(e){}
function applyLang(){
  const u=UI[lang]; document.documentElement.lang=lang;
  document.getElementById('eye').textContent=u.eye;
  document.getElementById('sub').textContent=u.sub;
  document.getElementById('hint').textContent=u.hint;
  document.getElementById('bcy').setAttribute('aria-pressed',lang==='cy');
  document.getElementById('ben').setAttribute('aria-pressed',lang==='en');
}
function setLang(l){ lang=l; try{ localStorage.setItem('ttg-penteract-lang',l) }catch(e){} applyLang(); }
document.getElementById('bcy').onclick=()=>setLang('cy');
document.getElementById('ben').onclick=()=>setLang('en');

/* ---------------- 5D view (the big cube) ---------------- */
const N=5;
let R=[...Array(N)].map((_,i)=>[...Array(N)].map((_,j)=>i===j?1:0));
let drift=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function rotM(M,i,j,a){ const c=Math.cos(a),s=Math.sin(a); const ri=M[i],rj=M[j]; for(let k=0;k<N;k++){ const x=ri[k],y=rj[k]; ri[k]=c*x+s*y; rj[k]=-s*x+c*y; } }
function gs(M){ for(let i=0;i<N;i++){ for(let j=0;j<i;j++){ let d=0; for(let k=0;k<N;k++) d+=M[i][k]*M[j][k]; for(let k=0;k<N;k++) M[i][k]-=d*M[j][k]; } let n=Math.hypot(...M[i])||1; for(let k=0;k<N;k++) M[i][k]/=n; } return M; }
(function(){ // a readable tilted start
  let seed=13; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let m=0;m<9;m++){ const i=Math.floor(rnd()*5); let j=Math.floor(rnd()*4); if(j>=i) j++; rotM(R,i,j,(rnd()-.5)*3); } gs(R);
})();
function projectM(M,p){
  const v=M.map(r=>r[0]*p[0]+r[1]*p[1]+r[2]*p[2]+r[3]*p[3]+r[4]*p[4]);
  const persp=3.2/(3.2-v[2]*.9);
  const fold=Math.min(1,Math.hypot(v[3],v[4])/1.6);
  return {x:v[0]*persp, y:v[1]*persp, fold};
}

/* penteract: 32 corners, 80 edges */
const PV=[], PE=[];
for(let i=0;i<32;i++) PV.push([0,1,2,3,4].map(b=>(i>>b)&1?1:-1));
for(let i=0;i<32;i++) for(let b=0;b<5;b++){ const j=i^(1<<b); if(j>i) PE.push([i,j]); }

/* doors: each a small penteract with its own slow turn */
for(const d of DOORS){
  d.M=[...Array(N)].map((_,i)=>[...Array(N)].map((_,j)=>i===j?1:0));
  d.ph=Math.random()*7;
}

/* ---------------- canvas ---------------- */
const cv=document.getElementById('c'), g=cv.getContext('2d');
let Wd=0,Ht=0,dpr=1,cx=0,cy=0,S=1,ring=1,ds=1;
function resize(){
  dpr=Math.min(2,devicePixelRatio||1); Wd=innerWidth; Ht=innerHeight;
  cv.width=Wd*dpr; cv.height=Ht*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  cx=Wd/2; cy=Ht*.52;
  const m=Math.min(Wd,Ht);
  S=m*.24; ring=m*.40; ds=m*.052;
}
addEventListener('resize',resize); resize();

function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }

let dragging=false, moved=0, lx=0, ly=0, hover=null, t0=performance.now();

function doorPos(i,t){
  const n=DOORS.length;
  const a=-Math.PI/2 + i*2*Math.PI/n + Math.sin(t*.0004+i)*0.03;
  const squash=Wd<760?0.88:0.62;           // taller ring on phones so nothing sits under the title
  return {x:cx+Math.cos(a)*ring*(Wd<760?0.78:1), y:cy+Math.sin(a)*ring*squash};
}

function draw(now){
  const dt=Math.min(.05,(now-t0)/1000); t0=now;
  if(drift && !dragging){ const t=now/1000; rotM(R,0,2,dt*.07*Math.sin(t*.13+1)); rotM(R,1,3,dt*.06); rotM(R,0,4,dt*.045*Math.cos(t*.09)); rotM(R,2,3,dt*.05); rotM(R,1,4,dt*.03); gs(R); }
  g.clearRect(0,0,Wd,Ht);
  g.fillStyle='#07090a'; g.fillRect(0,0,Wd,Ht);

  // the big penteract
  const pv=PV.map(p=>projectM(R,p));
  g.lineWidth=1;
  for(const [i,j] of PE){ const a=pv[i],c=pv[j];
    g.strokeStyle=`rgba(230,223,204,${.05+.11*(1-(a.fold+c.fold)/2)})`;
    g.beginPath(); g.moveTo(cx+a.x*S,cy+a.y*S); g.lineTo(cx+c.x*S,cy+c.y*S); g.stroke(); }

  // doors
  g.textAlign='center';
  DOORS.forEach((d,i)=>{
    const hot = hover===d;
    rotM(d.M,0,2,dt*(hot?.9:.22)); rotM(d.M,1,4,dt*(hot?.7:.17)); rotM(d.M,2,3,dt*.13); gs(d.M);
    const p=doorPos(i,now); d.x=p.x; d.y=p.y;
    const k=ds*(hot?1.25:1);
    // a faint way from the cube to the door
    g.strokeStyle=hexA(d.col,hot?.4:.13);
    g.beginPath(); g.moveTo(cx+pv[16].x*S*.4,cy+pv[16].y*S*.4); g.lineTo(d.x,d.y); g.stroke();
    const dv=PV.map(q=>projectM(d.M,q));
    for(const [a,b] of PE){ const p1=dv[a],p2=dv[b];
      g.strokeStyle=hexA(d.col,(hot?.5:.24)+.2*(1-(p1.fold+p2.fold)/2));
      g.beginPath(); g.moveTo(d.x+p1.x*k,d.y+p1.y*k); g.lineTo(d.x+p2.x*k,d.y+p2.y*k); g.stroke(); }
    const fs=Wd<760?10:11;
    g.font=fs+'px ui-monospace,Menlo,monospace';
    g.fillStyle=hot?d.col:'rgba(138,144,127,.95)';
    g.fillText(lang==='cy'?d.cy:d.en, d.x, d.y+k+fs+8);
  });
  requestAnimationFrame(draw);
}

/* ---------------- pointer ---------------- */
function hit(x,y){
  let best=null,bd=1e9;
  for(const d of DOORS){ if(d.x===undefined) continue;
    const r=Math.max(30,ds*1.9), dd=Math.hypot(d.x-x,d.y-y);
    if(dd<r&&dd<bd){bd=dd;best=d} }
  return best;
}
cv.addEventListener('pointerdown',e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
cv.addEventListener('pointermove',e=>{
  if(dragging){ const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    rotM(R,0,1,dx*.004); rotM(R,1,2,dy*.004); rotM(R,3,4,(dx+dy)*.0015); gs(R); }
  hover=hit(e.clientX,e.clientY); cv.classList.toggle('hot',!!hover&&!dragging);
});
cv.addEventListener('pointerup',e=>{ dragging=false; cv.classList.remove('drag');
  if(moved<6){ const h=hit(e.clientX,e.clientY); if(h) location.href=h.href; } });
cv.addEventListener('wheel',e=>{ e.preventDefault(); rotM(R,2,4,e.deltaY*.0015); rotM(R,3,4,e.deltaX*.0015); gs(R); },{passive:false});

applyLang();
requestAnimationFrame(draw);
</script>
</body>
</html>
