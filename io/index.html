<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jack Punchcard Reader / Printer</title>
<style>
  :root{
    --paper:#e8dfbf;
    --ink:#171717;
    --hole:#0c0c0c;
    --muted:#6b6556;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    min-height:100%;
    background:#161616;
    color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  body{
    padding:12px;
  }

  .machine{
    max-width:1100px;
    margin:auto;
    background:var(--paper);
    border:2px solid var(--ink);
    min-height:calc(100vh - 24px);
    display:flex;
    flex-direction:column;
  }

  header{
    padding:14px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  h1{
    font-size:18px;
    margin:0 0 4px;
  }

  .sub{
    font-size:11px;
    color:var(--muted);
  }

  .drop{
    margin:14px;
    border:2px dashed var(--ink);
    padding:18px;
    text-align:center;
    cursor:pointer;
    user-select:none;
  }

  .drop.drag{
    background:#fff8d7;
  }

  input[type=file]{
    display:none;
  }

  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:0 14px 14px;
  }

  button{
    border:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-weight:700;
    padding:8px 12px;
    cursor:pointer;
  }

  button:active{
    transform:translateY(1px);
  }

  .meta{
    padding:0 14px 10px;
    font-size:12px;
  }

  .card-wrap{
    overflow:auto;
    padding:14px;
    border-top:2px solid var(--ink);
    border-bottom:2px solid var(--ink);
    background:#b6ae93;
  }

  .card{
    min-width:900px;
    background:var(--paper);
    border:2px solid var(--ink);
    padding:14px;
  }

  .legend{
    display:grid;
    grid-template-columns:48px repeat(80, 10px);
    gap:2px;
    font-size:8px;
    margin-bottom:4px;
  }

  .legend div{
    text-align:center;
  }

  .grid{
    display:grid;
    grid-template-columns:48px repeat(80, 10px);
    gap:2px;
    align-items:center;
  }

  .rowlabel{
    text-align:right;
    padding-right:8px;
    font-size:10px;
    color:var(--muted);
  }

  .cell{
    width:10px;
    height:13px;
    border:1px solid rgba(0,0,0,.22);
    background:#f5edcd;
  }

  .cell.on{
    background:var(--hole);
    border-color:var(--hole);
  }

  .readout{
    padding:14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  pre{
    margin:0;
    padding:12px;
    border:2px solid var(--ink);
    background:#f4ecd0;
    min-height:180px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
    font-size:11px;
  }

  .label{
    font-size:10px;
    font-weight:700;
    margin-bottom:5px;
  }

  footer{
    padding:10px 14px;
    margin-top:auto;
    font-size:10px;
    color:var(--muted);
  }

  @media(max-width:700px){
    body{padding:0}
    .machine{min-height:100vh;border-left:0;border-right:0}
    .readout{grid-template-columns:1fr}
  }

  @media print{
    body{background:#fff;padding:0}
    .drop,.toolbar,.readout,footer{display:none}
    .machine{border:0}
    .card-wrap{background:#fff;border:0;padding:0}
    .card{border:1px solid #000}
  }
</style>
</head>
<body>

<div class="machine">
  <header>
    <div>
      <h1>¥JACK / PUNCHCARD READER + PRINTER</h1>
      <div class="sub">80 columns · 12 rows · 120 bytes per card</div>
    </div>
    <div class="sub" id="status">NO CARD INSERTED</div>
  </header>

  <label class="drop" id="drop">
    DROP FILE HERE<br>
    <span class="sub">or tap to choose</span>
    <input type="file" id="file">
  </label>

  <div class="toolbar">
    <button id="prev">← PREV</button>
    <button id="next">NEXT →</button>
    <button id="print">PRINT CARD</button>
    <button id="save">SAVE TXT</button>
  </div>

  <div class="meta" id="meta">
    CARD 0 / 0
  </div>

  <div class="card-wrap">
    <div class="card">
      <div class="legend" id="legend"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="readout">
    <div>
      <div class="label">HEX</div>
      <pre id="hex"></pre>
    </div>
    <div>
      <div class="label">ASCII / UTF-8 APPROXIMATION</div>
      <pre id="ascii"></pre>
    </div>
  </div>

  <footer>
    Encoding: sequential bytes → 8 data rows. Extra four rows are parity / framing marks.
  </footer>
</div>

<script>
const COLS = 80;
const ROWS = 12;
const BYTES_PER_CARD = 120;

let bytes = new Uint8Array();
let page = 0;
let filename = "";

const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const grid = document.getElementById("grid");
const legend = document.getElementById("legend");
const meta = document.getElementById("meta");
const status = document.getElementById("status");
const hexOut = document.getElementById("hex");
const asciiOut = document.getElementById("ascii");

function buildLegend(){
  legend.innerHTML = "<div></div>";
  for(let c=0;c<COLS;c++){
    const d = document.createElement("div");
    d.textContent = (c+1)%10;
    legend.appendChild(d);
  }
}

function emptyGrid(){
  grid.innerHTML = "";
  for(let r=0;r<ROWS;r++){
    const label = document.createElement("div");
    label.className = "rowlabel";
    label.textContent = r < 8 ? "BIT " + (7-r) : ["P","S","E","J"][r-8];
    grid.appendChild(label);

    for(let c=0;c<COLS;c++){
      const cell = document.createElement("div");
      cell.className = "cell";
      grid.appendChild(cell);
    }
  }
}

function cardCount(){
  return bytes.length ? Math.ceil(bytes.length / BYTES_PER_CARD) : 0;
}

function sliceCard(){
  const start = page * BYTES_PER_CARD;
  return bytes.slice(start, start + BYTES_PER_CARD);
}

function render(){
  emptyGrid();

  const count = cardCount();

  if(!count){
    meta.textContent = "CARD 0 / 0";
    status.textContent = "NO CARD INSERTED";
    hexOut.textContent = "";
    asciiOut.textContent = "";
    return;
  }

  page = Math.max(0, Math.min(page, count - 1));

  const chunk = sliceCard();
  status.textContent = filename.toUpperCase();
  meta.textContent =
    `CARD ${page+1} / ${count} · ${chunk.length} BYTES · OFFSET ${page * BYTES_PER_CARD}`;

  const cells = grid.querySelectorAll(".cell");

  /*
    120 bytes = 960 bits.
    Card = 80 x 12 = 960 physical positions.

    First 8 logical rows encode byte bits,
    remaining 4 rows are used as framing/parity rows.
  */

  const bits = [];

  for(const b of chunk){
    for(let bit=7;bit>=0;bit--){
      bits.push((b >> bit) & 1);
    }
  }

  while(bits.length < COLS * ROWS){
    bits.push(0);
  }

  for(let i=0;i<COLS*ROWS;i++){
    if(bits[i]){
      cells[i].classList.add("on");
    }
  }

  const hex = [...chunk]
    .map((b,i)=>b.toString(16).padStart(2,"0"))
    .reduce((lines,v,i)=>{
      const line = Math.floor(i/16);
      lines[line] = (lines[line] || "") + v + " ";
      return lines;
    },[])
    .join("\n");

  hexOut.textContent = hex;

  asciiOut.textContent = [...chunk]
    .map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : "·")
    .join("");
}

async function loadFile(file){
  filename = file.name;
  const buffer = await file.arrayBuffer();
  bytes = new Uint8Array(buffer);
  page = 0;
  render();
}

fileInput.addEventListener("change", e=>{
  if(e.target.files[0]) loadFile(e.target.files[0]);
});

drop.addEventListener("dragover", e=>{
  e.preventDefault();
  drop.classList.add("drag");
});

drop.addEventListener("dragleave", ()=>{
  drop.classList.remove("drag");
});

drop.addEventListener("drop", e=>{
  e.preventDefault();
  drop.classList.remove("drag");

  const file = e.dataTransfer.files[0];
  if(file) loadFile(file);
});

document.getElementById("prev").onclick = ()=>{
  if(page > 0){
    page--;
    render();
  }
};

document.getElementById("next").onclick = ()=>{
  if(page < cardCount()-1){
    page++;
    render();
  }
};

document.getElementById("print").onclick = ()=>{
  window.print();
};

document.getElementById("save").onclick = ()=>{
  if(!bytes.length) return;

  const chunk = sliceCard();

  const output = {
    system: "¥JACK PUNCHCARD",
    filename,
    card: page + 1,
    cards: cardCount(),
    offset: page * BYTES_PER_CARD,
    bytes: [...chunk],
    hex: [...chunk].map(b=>b.toString(16).padStart(2,"0")).join(" ")
  };

  const blob = new Blob(
    [JSON.stringify(output,null,2)],
    {type:"text/plain"}
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `jack-card-${page+1}.txt`;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

buildLegend();
render();
</script>

<script src="/assets/ask-jack.js?v=1" defer></script>
</body>
</html>
