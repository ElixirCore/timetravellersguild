<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1240" viewBox="0 0 800 1240" font-family="Menlo,Consolas,monospace">
<rect width="800" height="1240" fill="#07090a"/>
<rect x="20" y="20" width="760" height="1200" fill="none" stroke="#6bf27a" stroke-width="1.5"/>
<text x="40" y="56" fill="#6bf27a" font-size="13" letter-spacing="3">TIMETRAVELLERS GUILD · COINDROP</text>
<text x="40" y="82" fill="#e6dfcc" font-size="19" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif">Money-box Jack - reference build sheet</text>
<text x="40" y="106" fill="#8a907f" font-size="11">REFERENCE DESIGN, UNBUILT. Verify every part and connection against the</text>
<text x="40" y="122" fill="#8a907f" font-size="11">supplier datasheet before fabrication. No mains voltage inside the box.</text>

<!-- front panel -->
<text x="40" y="160" fill="#d9a441" font-size="13">1 · FRONT PANEL (6 mm plywood or 3D print, 200 mm wide)</text>
<rect x="60" y="174" width="200" height="260" fill="#0d100f" stroke="#6bf27a"/>
<rect x="110" y="214" width="100" height="8" rx="4" fill="#000" stroke="#d9a441"/>
<text x="160" y="210" fill="#8a907f" font-size="10" text-anchor="middle">coin slot (over mech mouth)</text>
<rect x="110" y="254" width="100" height="100" fill="none" stroke="#8a907f" stroke-dasharray="3 3"/>
<text x="160" y="308" fill="#8a907f" font-size="10" text-anchor="middle">cube face print</text>
<circle cx="160" cy="394" r="16" fill="none" stroke="#8a907f"/>
<circle cx="120" cy="394" r="16" fill="none" stroke="#8a907f"/>
<circle cx="200" cy="394" r="16" fill="none" stroke="#8a907f"/>
<text x="160" y="426" fill="#8a907f" font-size="10" text-anchor="middle">speaker grille (drilled)</text>
<text x="290" y="194" fill="#8a907f" font-size="11">Panel: 200 x 260 mm.</text>
<text x="290" y="212" fill="#8a907f" font-size="11">Slot cutout aligned to mech face,</text>
<text x="290" y="228" fill="#8a907f" font-size="11">mech bolted behind panel.</text>
<text x="290" y="254" fill="#8a907f" font-size="11">Grille over 40 mm speaker.</text>
<text x="290" y="280" fill="#8a907f" font-size="11">Rear service hatch for SD card</text>
<text x="290" y="296" fill="#8a907f" font-size="11">and mech coin box.</text>

<!-- internal layout -->
<text x="40" y="484" fill="#d9a441" font-size="13">2 · INTERNAL LAYOUT (top view, 200 x 140 mm floor)</text>
<rect x="60" y="500" width="300" height="180" fill="#0d100f" stroke="#6bf27a"/>
<rect x="76" y="514" width="80" height="60" fill="none" stroke="#e6dfcc"/>
<text x="116" y="548" fill="#e6dfcc" font-size="10" text-anchor="middle">CH-926 mech</text>
<rect x="180" y="514" width="70" height="46" fill="none" stroke="#e6dfcc"/>
<text x="215" y="541" fill="#e6dfcc" font-size="10" text-anchor="middle">ESP32</text>
<rect x="266" y="514" width="76" height="46" fill="none" stroke="#e6dfcc"/>
<text x="304" y="541" fill="#e6dfcc" font-size="10" text-anchor="middle">DFPlayer</text>
<circle cx="120" cy="624" r="34" fill="none" stroke="#e6dfcc"/>
<text x="120" y="628" fill="#e6dfcc" font-size="10" text-anchor="middle">speaker 8R</text>
<rect x="180" y="604" width="160" height="50" fill="none" stroke="#e6dfcc" stroke-dasharray="3 3"/>
<text x="260" y="626" fill="#8a907f" font-size="10" text-anchor="middle">12 V brick lead +</text>
<text x="260" y="640" fill="#8a907f" font-size="10" text-anchor="middle">5 V USB in (rear)</text>

<!-- wiring -->
<text x="40" y="730" fill="#d9a441" font-size="13">3 · WIRING (reference circuit - read the warning)</text>
<g font-size="11" fill="#e6dfcc">
<rect x="60" y="750" width="110" height="52" fill="none" stroke="#e6dfcc"/>
<text x="115" y="770" text-anchor="middle">CH-926</text>
<text x="115" y="784" text-anchor="middle" fill="#8a907f" font-size="9">R red / K blk / W wht / G gry</text>
<rect x="60" y="878" width="110" height="40" fill="none" stroke="#e6dfcc"/>
<text x="115" y="903" text-anchor="middle">12 V 1 A supply</text>
<rect x="330" y="750" width="120" height="76" fill="none" stroke="#e6dfcc"/>
<text x="390" y="766" text-anchor="middle">ESP32</text>
<text x="390" y="780" text-anchor="middle" font-size="9" fill="#8a907f">GPIO27 (INPUT_PULLUP)</text>
<text x="390" y="794" text-anchor="middle" font-size="9" fill="#8a907f">GPIO17 TX2 · 16 RX2 · 26 BUSY</text>
<rect x="560" y="750" width="120" height="52" fill="none" stroke="#e6dfcc"/>
<text x="620" y="770" text-anchor="middle">DFPlayer Mini</text>
<text x="620" y="784" text-anchor="middle" font-size="9" fill="#8a907f">+ microSD FAT32</text>
<rect x="560" y="878" width="120" height="40" fill="none" stroke="#e6dfcc"/>
<text x="620" y="903" text-anchor="middle">Speaker 8 ohm 3 W</text>
<rect x="330" y="878" width="120" height="40" fill="none" stroke="#e6dfcc"/>
<text x="390" y="903" text-anchor="middle">5 V USB-C supply</text>
</g>
<g stroke="#d9a441" stroke-width="1.5" fill="none">
<path d="M115 802 L115 878"/>
<path d="M170 762 L330 762"/>
<path d="M170 792 L330 892" stroke-dasharray="4 3"/>
<path d="M450 760 L560 760"/>
<path d="M450 776 L560 776"/>
<path d="M620 802 L620 878"/>
<path d="M390 826 L390 878"/>
</g>
<g font-size="9.5" fill="#d9a441">
<text x="124" y="844">red: 12 V</text>
<text x="185" y="754">white COIN via 1-10k series R</text>
<text x="185" y="816" fill="#8a907f">black GND: common to 12 V and 5 V grounds</text>
<text x="458" y="752">TX2 via 1k to RX</text>
<text x="458" y="790" fill="#8a907f">RX2 to TX</text>
<text x="628" y="844">SPK_1 / SPK_2 (no ground)</text>
<text x="398" y="856" fill="#8a907f">5 V to ESP32 + DFPlayer VCC</text>
</g>
<rect x="60" y="950" width="700" height="86" fill="none" stroke="#d9a441"/>
<text x="72" y="972" fill="#d9a441" font-size="11">WARNING: COIN is open-collector - it pulls to GND and never sources voltage.</text>
<text x="72" y="988" fill="#d9a441" font-size="11">Pull up to 3.3 V only, NEVER to 12 V. Before connecting, power the mech</text>
<text x="72" y="1004" fill="#d9a441" font-size="11">alone and measure COIN-to-GND: some clones carry an internal pull-up to a</text>
<text x="72" y="1020" fill="#d9a441" font-size="11">higher voltage. Keep the series resistor; add a diode clamp if over 3.3 V.</text>

<!-- firmware + checks -->
<text x="40" y="1078" fill="#d9a441" font-size="13">4 · FIRMWARE + SETUP</text>
<text x="60" y="1100" fill="#8a907f" font-size="11">Mech switch NO; speed slow; teach £1 = 1 pulse with real coins. Code counts</text>
<text x="60" y="1116" fill="#8a907f" font-size="11">the burst, then plays one track while BUSY is low; extra coins mid-line are</text>
<text x="60" y="1132" fill="#8a907f" font-size="11">ignored. Tracks on SD as 0001.mp3 upward - Jack's recorded lines.</text>
<text x="60" y="1156" fill="#8a907f" font-size="11">Checks before power: rail polarity and continuity; COIN voltage as above;</text>
<text x="60" y="1172" fill="#8a907f" font-size="11">speaker 8 ohm; nothing mains-voltage inside the box.</text>
<text x="40" y="1206" fill="#6bf27a" font-size="10" letter-spacing="2">COINDROP · TIMETRAVELLERSGUILD.COM/COINDROP · REFERENCE DESIGN, UNBUILT</text>
</svg>
