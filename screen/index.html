<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCREEN — timetravellersguild.com</title>
<meta name="description" content="Three windows of screen footage composited on a shared schedule. Everyone sees the same algorithmic edit.">
<meta name="theme-color" content="#0c0b09">
<link rel="canonical" href="https://timetravellersguild.com/screen">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:site_name" content="TIMETRAVELLERSGUILD.COM">
<meta property="og:title" content="SCREEN — timetravellersguild.com">
<meta property="og:description" content="Three recordings composited on a shared schedule. Everyone sees the same algorithmic edit.">
<meta property="og:url" content="https://timetravellersguild.com/screen">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #0c0b09;
  --line: rgba(255,220,150,.08);
  --ink:  #f1e4c4;
  --dim:  rgba(241,228,196,.38);
  --gold: #d9b86a;
  --ui:   'Barlow Condensed','Arial Narrow',sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; }
body { min-height: 100dvh; display: flex; flex-direction: column; font-family: var(--serif); }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }

/* ── masthead ── */
header.mast {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; flex-shrink: 0;
  padding: 9px max(16px,env(safe-area-inset-left));
  font-family: var(--ui); letter-spacing: .14em; text-transform: uppercase; font-size: 12px;
  color: var(--dim);
}
header.mast a { color: var(--ink); }
h1 { margin: 0; font-family: var(--ui); font-weight: 600; letter-spacing: .22em; font-size: 12px; display: inline; }

/* ── main layout ── */
main {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
  padding: 0 max(14px,env(safe-area-inset-left)) 10px; gap: 8px;
}

/* ── compositor stage ── */
#stage {
  position: relative; flex: 1; min-height: 0;
  background: #000; border-radius: 6px; overflow: hidden;
  height: calc(100dvh - 100px); min-height: 240px;
}
#stage:fullscreen { border-radius: 0; height: 100dvh; }

/* compositor: three videos stacked */
#comp {
  position: absolute; inset: 0;
  background: #000;
}
#comp video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  /* Smooth opacity crossfades between phrases */
  transition: opacity 1.4s ease;
}

/* ── gate ── */
#gate {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  background: rgba(12,11,9,.68); backdrop-filter: blur(10px);
  text-align: center; padding: 24px;
}
#gate[hidden] { display: none; }
#gate .big {
  font-family: var(--ui); font-size: clamp(20px,3.6vw,44px);
  letter-spacing: .3em; text-transform: uppercase;
  padding: .42em 1.4em; border: 1px solid var(--gold);
  background: transparent; cursor: pointer; color: var(--ink);
  transition: background .18s, color .18s;
}
#gate .big:hover { background: var(--gold); color: #16120a; }
#gate p { margin: 0; color: var(--dim); max-width: 28em; font-size: 14px; line-height: 1.55; }
#gate .quiet {
  background: none; border: 0; color: var(--dim);
  text-decoration: underline; cursor: pointer;
  font-family: var(--ui); letter-spacing: .1em; text-transform: uppercase; font-size: 12px;
}

/* ── no signal ── */
#empty {
  position: absolute; inset: 0; z-index: 4;
  display: none; align-items: center; justify-content: center;
  font-family: var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
}
#stage.nosignal #empty { display: flex; }

/* ── dock ── */
#dock {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0;
  font-family: var(--ui); letter-spacing: .1em; text-transform: uppercase; font-size: 13px;
}
#dock label { display: flex; align-items: center; gap: 8px; color: var(--dim); }
#dock input[type=range] { width: min(200px,40vw); }
#dock .sp { flex: 1; }
#hint { color: var(--dim); font-family: var(--ui); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }

.btn {
  min-height: 28px; padding: 1px 10px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
  border-radius: 3px; cursor: pointer;
  font-family: var(--ui); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  transition: background .14s, border-color .14s; white-space: nowrap;
}
.btn:hover { border-color: var(--gold); background: rgba(217,184,106,.1); }
.btn[aria-pressed=true] { background: var(--gold); color: #16120a; border-color: var(--gold); }
input[type=range] { accent-color: var(--gold); height: 24px; }

.sr { position: absolute; left: -9999px; }

@media (max-width: 600px) {
  #stage { height: calc(100dvh - 90px); }
  main { padding-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  #comp video { transition: none; }
}
</style>
</head>
<body>
<header class="mast">
  <div><a href="/">TIMETRAVELLERSGUILD.COM</a> &nbsp;/&nbsp; <h1>SCREEN</h1></div>
  <div id="clock" style="color:var(--dim)">UTC —</div>
</header>

<main>
  <div id="stage" aria-label="Three recordings algorithmically composited">
    <div id="comp"></div>
    <div id="empty">No signal</div>
    <div id="gate">
      <button type="button" class="big" id="tune">Tune in</button>
      <p>Three recordings composited on a shared schedule — everyone watching sees the same algorithmic edit. Sound is off until you tune in.</p>
      <button type="button" class="quiet" id="quiet">Watch without sound</button>
    </div>
  </div>

  <div id="dock">
    <button type="button" class="btn" id="mmute" aria-pressed="false">Mute</button>
    <label>Volume <input type="range" id="master" min="0" max="100" step="1" aria-label="Master volume"></label>
    <span class="sp"></span>
    <button type="button" class="btn" id="full">Fullscreen</button>
  </div>
  <p id="hint">M mute &middot; F fullscreen</p>
</main>

<noscript><p style="padding:16px">SCREEN needs JavaScript.</p></noscript>
<script src="scheduler.js?v=1"></script>
<script src="player.js?v=3"></script>
</body>
</html>
