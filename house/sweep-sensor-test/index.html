<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Guild / sensor sweep test</title><style>:root{color-scheme:dark;background:#030605;color:#dce5d2;font:15px system-ui}*{box-sizing:border-box}body{margin:0}main{height:100dvh;padding:10px;display:flex;flex-direction:column;gap:10px}.screen{background:#020303;flex:1;position:relative;overflow:hidden;border:1px solid #879d8455;display:grid;place-items:center}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}canvas{background:#020303}.screen:not(.has-result) canvas,.screen.has-result video{display:none}.readout{position:absolute;z-index:2;bottom:12px;left:10px;right:10px;background:#080d0be8;padding:9px;font:11px ui-monospace,monospace}.status{font-size:12px;text-align:center;min-height:16px;margin:0}button{border:0;border-radius:50%;background:#cce48e;color:#172017;font:700 14px ui-monospace,monospace;letter-spacing:.04em;width:112px;height:112px;min-height:112px;align-self:center;touch-action:none;user-select:none;-webkit-user-select:none}button.is-held{background:#eafaa8}</style></head><body><main><div class="screen" id="screen"><video id="video" autoplay muted playsinline></video><canvas id="result" width="2048" height="1536"></canvas><div class="readout" id="readout">SENSOR awaiting hold</div></div><p class="status" id="status" role="status" aria-live="polite"></p><button id="hold" type="button">HOLD</button></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),video=$('video'),button=$('hold'),canvas=$('result'),ctx=canvas.getContext('2d',{willReadFrequently:true}),screen=$('screen');let stream=null,held=false,capturing=false,timer=0,frames=0,originX=704,originY=0,last=null,lastOrigin={x:704,y:0},lastSensor=null,anchorSensor=null,lastIndex=0,owner=new Uint16Array(2048*1536),session=0,working=false,rejected=0,miss={visual:0,edge:0,still:0},bounds={x0:2048,y0:1536,x1:0,y1:0};const TILE=640,LOW_W=160,MAX_FRAMES=85;let tile=document.createElement('canvas'),tc=tile.getContext('2d',{willReadFrequently:true}),small=document.createElement('canvas'),sc=small.getContext('2d',{willReadFrequently:true});tile.width=TILE;small.width=LOW_W;
let orientation={state:'not-requested',samples:0,alpha:null,beta:null,gamma:null,absolute:false,firstAt:0,lastAt:0};
function onOrientation(e){if(!Number.isFinite(e.alpha)&&!Number.isFinite(e.beta)&&!Number.isFinite(e.gamma))return;orientation.samples++;orientation.alpha=Number.isFinite(e.alpha)?e.alpha:null;orientation.beta=Number.isFinite(e.beta)?e.beta:null;orientation.gamma=Number.isFinite(e.gamma)?e.gamma:null;orientation.absolute=!!e.absolute;orientation.lastAt=Date.now();if(!orientation.firstAt)orientation.firstAt=orientation.lastAt;orientation.state='readings';readout('SENSOR readings '+orientation.samples+' / α '+orientation.alpha+' β '+orientation.beta+' / waiting for frames')}

function status(text){$('status').textContent=text}function hideStatus(){}function readout(text){$('readout').textContent=text}function clear(){canvas.width=2048;canvas.height=1536;ctx.fillStyle='#020303';ctx.fillRect(0,0,2048,1536);owner.fill(0);frames=0;rejected=0;miss={visual:0,edge:0,still:0};bounds={x0:2048,y0:1536,x1:0,y1:0};last=null;originX=704;originY=0;lastOrigin={x:704,y:0};lastSensor=null;anchorSensor=null;screen.classList.remove('has-result');hideStatus()}
function gray(source){small.height=Math.round(source.height*LOW_W/source.width);sc.drawImage(source,0,0,LOW_W,small.height);let d=sc.getImageData(0,0,LOW_W,small.height).data,a=new Uint8Array(LOW_W*small.height);for(let i=0;i<a.length;i++)a[i]=(d[i*4]*3+d[i*4+1]*6+d[i*4+2]) / 10;return {data:a,w:LOW_W,h:small.height}}

function wrapAngle(a){return (a+540)%360-180}
function sensorNow(){return orientation.state==='readings'&&Date.now()-orientation.lastAt<700&&Number.isFinite(orientation.alpha)&&Number.isFinite(orientation.beta)?{alpha:orientation.alpha,beta:orientation.beta}:null}
function compose(x,y,index){let x0=Math.max(0,x),y0=Math.max(0,y),x1=Math.min(2048,x+tile.width),y1=Math.min(1536,y+tile.height);if(x1<=x0||y1<=y0)return 0;let w=x1-x0,h=y1-y0,src=tc.getImageData(x0-x,y0-y,w,h).data,dst=ctx.getImageData(x0,y0,w,h),dd=dst.data,changed=0;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){let oi=(y0+yy)*2048+x0+xx;if(owner[oi])continue;let i=(yy*w+xx)*4;dd[i]=src[i];dd[i+1]=src[i+1];dd[i+2]=src[i+2];dd[i+3]=255;owner[oi]=index;changed++}if(changed){ctx.putImageData(dst,x0,y0);bounds.x0=Math.min(bounds.x0,x0);bounds.y0=Math.min(bounds.y0,y0);bounds.x1=Math.max(bounds.x1,x1);bounds.y1=Math.max(bounds.y1,y1)}return changed}

async function start(){if(capturing)return;let token=++session;held=true;clear();button.classList.add('is-held');button.textContent='SWEEP';hideStatus();try{if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext)throw Error('Camera needs HTTPS and a supported browser.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(token!==session||!held){stream.getTracks().forEach(t=>t.stop());stream=null;return}video.srcObject=stream;await video.play();if(token!==session||!held)return;capturing=true;sample();timer=setInterval(sample,160);hideStatus()}catch(e){held=false;button.classList.remove('is-held');button.textContent='HOLD';status(e.name==='NotAllowedError'?'Camera access was denied. Allow it and hold again.':e.message);stop()}}
function stop(){clearInterval(timer);timer=0;capturing=false;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}
function finish(){if(!held&&!capturing)return;held=false;session++;button.classList.remove('is-held');button.textContent='HOLD';stop();if(frames){;readout('FINISHED '+frames+' / SENSOR '+orientation.state+' '+orientation.samples+' READINGS / VISUAL MISSES '+miss.visual+' / EDGES '+miss.edge);status('Saved to device. Not on server.');canvas.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guild-glitchy-sweep-'+Date.now()+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/jpeg',.9)}else{status('No registered frames. Hold until the camera appears, then move.');readout('NO CAPTURE / UNCAPTURED DIRECTIONS BLACK')}}

if(new URLSearchParams(location.search).get('demo')==='1'){button.hidden=true;;status('Synthetic two-frame overlap, local pixels only.');let image=new Image();image.onload=()=>{clear();tile.height=360;let fixture=document.createElement('canvas');fixture.width=840;fixture.height=360;let fc=fixture.getContext('2d');fc.drawImage(image,0,0,840,360);tc.drawImage(fixture,0,0,640,360,0,0,640,360);let first=gray(tile);originY=332;compose(704,332,1);frames=1;last=first;lastOrigin={x:704,y:332};lastIndex=1;tc.drawImage(fixture,200,0,640,360,0,0,640,360);let next=gray(tile),a=align(first,next),dx=Math.round(a.dx*4);if(a.cost<36&&Math.abs(dx)>18){compose(704+dx,332,2);frames=2;lastIndex=2;lastOrigin={x:704+dx,y:332};screen.classList.add('has-result');readout('TEST: '+frames+' FRAMES / OFFSET '+dx+' / ERROR '+a.cost.toFixed(1));status('Visual fixture aligned. This is not a camera test.')}else{screen.classList.add('has-result');status('Visual fixture did not register: '+a.cost.toFixed(1)+' / '+dx)}};image.src='../assets/roomskins/panorama-workspace-moonly-20260929.jpg'}
