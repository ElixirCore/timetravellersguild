<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IBM 5081 punch card">
  <title>IBM 5081  Time Travellers Guild</title>
  <rect width="64" height="64" fill="#1e3a5f"/>
  <!-- Manila hopper stock, corner-cut, scarlet stripe, real TTG Hollerith -->
  <path d="M10 16 H20 L10 26 Z" fill="#1e3a5f"/>
  <path d="M20 16 H54 V48 H10 V26 Z" fill="#f1e4c4"/>
  <path d="M10 26 V48 H14 V22 Z" fill="#c41e3a"/>
  <path d="M20 16 H54 V18.2 H20 Z" fill="#1a2438" opacity=".12"/>
  <!-- ruler ticks -->
  <g fill="#1e3a5f" opacity=".55">
    <rect x="22" y="16.4" width="0.7" height="2.2"/>
    <rect x="26" y="16.4" width="0.7" height="2.2"/>
    <rect x="30" y="16.4" width="0.7" height="3.1"/>
    <rect x="34" y="16.4" width="0.7" height="2.2"/>
    <rect x="38" y="16.4" width="0.7" height="2.2"/>
    <rect x="42" y="16.4" width="0.7" height="3.1"/>
    <rect x="46" y="16.4" width="0.7" height="2.2"/>
    <rect x="50" y="16.4" width="0.7" height="2.2"/>
  </g>
  <!-- row rules -->
  <g stroke="#1e3a5f" stroke-width="0.35" opacity=".22">
    <line x1="16" y1="24" x2="52" y2="24"/>
    <line x1="16" y1="28" x2="52" y2="28"/>
    <line x1="16" y1="32" x2="52" y2="32"/>
    <line x1="16" y1="36" x2="52" y2="36"/>
    <line x1="16" y1="40" x2="52" y2="40"/>
    <line x1="16" y1="44" x2="52" y2="44"/>
  </g>
  <!-- T T G as IBM 5081 holes: T=0+3, T=0+3, G=12+7 -->
  <!-- rows from top of field: 12@22, 11@25.2, 0@28.4, 1@31.6, 2@34.8, 3@38, 7@44.4 -->
  <g fill="#1a2438">
    <ellipse cx="28" cy="28.4" rx="1.55" ry="1.25"/>
    <ellipse cx="28" cy="38" rx="1.55" ry="1.25"/>
    <ellipse cx="36" cy="28.4" rx="1.55" ry="1.25"/>
    <ellipse cx="36" cy="38" rx="1.55" ry="1.25"/>
    <ellipse cx="44" cy="22" rx="1.55" ry="1.25"/>
    <ellipse cx="44" cy="44.4" rx="1.55" ry="1.25"/>
  </g>
  <text x="51.2" y="46.8" font-family="Courier, monospace" font-size="3.2" fill="#1e3a5f" text-anchor="end" opacity=".7">5081</text>
</svg>
